# CodeRabbit Configuration File
# https://docs.coderabbit.ai/getting-started/configure-coderabbit

version: "2"
language: "en-US"
tone_instructions: "Be concise, constructive, and highlight potential security issues, memory leaks, or breaking changes in POS transactions."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "kitchflow"

chat:
  auto_reply: true
